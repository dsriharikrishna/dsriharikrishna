<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="50%" stop-color="#121324"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>

    <linearGradient id="aurora-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="text-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-violet" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <!-- Clip Paths -->
    <clipPath id="card-clip">
      <rect x="0" y="0" width="920" height="320" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Blinking REC dot */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .rec-pulse { animation: blink 1.2s infinite ease-in-out; }

    /* Ping animation for status pill */
    @keyframes ping {
      0% { r: 3.5; opacity: 1; }
      75%, 100% { r: 7.5; opacity: 0; }
    }
    .status-ping { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }

    /* Role Switcher Animation */
    @keyframes roleCycle1 {
      0%, 28% { opacity: 1; transform: translateY(0); }
      33%, 95% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes roleCycle2 {
      0%, 28% { opacity: 0; transform: translateY(8px); }
      33%, 61% { opacity: 1; transform: translateY(0); }
      66%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes roleCycle3 {
      0%, 61% { opacity: 0; transform: translateY(8px); }
      66%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(8px); }
    }
    .role-1 { animation: roleCycle1 9s infinite; }
    .role-2 { animation: roleCycle2 9s infinite; }
    .role-3 { animation: roleCycle3 9s infinite; }

    /* Scrubber animation */
    @keyframes scrub {
      0% { width: 0; }
      80% { width: 310px; }
      100% { width: 310px; }
    }
    .scrub-bar { animation: scrub 4s infinite linear; }
  </style>

  <!-- Base Card -->
  <rect x="1" y="1" width="918" height="318" rx="16" fill="url(#bg-grad)" stroke="url(#aurora-stroke)" stroke-width="1.2"/>
  <rect x="0" y="0" width="920" height="320" rx="16" fill="url(#dot-grid)" clip-path="url(#card-clip)"/>
  <rect x="0" y="0" width="920" height="320" rx="16" fill="url(#glow-cyan)" clip-path="url(#card-clip)"/>
  <rect x="0" y="0" width="920" height="320" rx="16" fill="url(#glow-violet)" clip-path="url(#card-clip)"/>

  <!-- ================= LEFT CONTENT ================= -->
  <!-- Collab / Status Pill -->
  <g transform="translate(42, 38)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#1e2238" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="15" cy="13" r="3.5" fill="#22d3ee"/>
    <circle cx="15" cy="13" r="3.5" fill="#22d3ee" class="status-ping" fill-opacity="0.6"/>
    <text x="28" y="17" fill="#67e8f9" class="font-mono" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO COLLABS</text>
  </g>

  <!-- Intro Line -->
  <g transform="translate(44, 94)">
    <text fill="#94a3b8" class="font-mono" font-size="14" letter-spacing="1">
      <tspan fill="#a78bfa" font-weight="700">&gt;</tspan> console.log(<tspan fill="#22d3ee">"Hi there, I'm"</tspan>);
    </text>
  </g>

  <!-- Big Name with Animated Aurora Gradient -->
  <g transform="translate(44, 142)">
    <text fill="url(#text-aurora)" class="font-sans" font-size="38" font-weight="800" letter-spacing="-0.8">
      Sriharikrishna Dasari
    </text>
  </g>

  <!-- Dynamic Cycling Roles -->
  <g transform="translate(46, 178)">
    <g class="role-1">
      <text fill="#f1f5f9" class="font-sans" font-size="17" font-weight="600">
        ⚡ Product Engineer <tspan fill="#64748b">•</tspan> <tspan fill="#22d3ee">Frontend Architecture</tspan>
      </text>
    </g>
    <g class="role-2">
      <text fill="#f1f5f9" class="font-sans" font-size="17" font-weight="600">
        🚀 Full Stack Developer <tspan fill="#64748b">•</tspan> <tspan fill="#a78bfa">Next.js, React, Node.js</tspan>
      </text>
    </g>
    <g class="role-3">
      <text fill="#f1f5f9" class="font-sans" font-size="17" font-weight="600">
        ☁️ Cloud &amp; DevOps Aspiring <tspan fill="#64748b">•</tspan> <tspan fill="#f472b6">AWS, Docker, IaC</tspan>
      </text>
    </g>
  </g>

  <!-- One-Line Pitch -->
  <g transform="translate(46, 215)">
    <text fill="#94a3b8" class="font-sans" font-size="13.5" font-weight="400">
      Crafting scalable, high-performance web systems, AI operation suites, &amp; resilient cloud architectures.
    </text>
  </g>

  <!-- Metadata Row (Location, Company, Experience) -->
  <g transform="translate(46, 268)">
    <!-- Location -->
    <g transform="translate(0, 0)">
      <path d="M6 1C3.24 1 1 3.24 1 6c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5zm0 6.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" fill="#a78bfa"/>
      <text x="18" y="11" fill="#cbd5e1" class="font-mono" font-size="11.5">Hyderabad, IN</text>
    </g>

    <!-- Company -->
    <g transform="translate(142, 0)">
      <path d="M2 3h12a1 1 0 011 1v9a1 1 0 01-1 1H2a1 1 0 01-1-1V4a1 1 0 011-1zm3 3v2h6V6H5z" fill="#22d3ee"/>
      <text x="18" y="11" fill="#cbd5e1" class="font-mono" font-size="11.5">Signitives IT Solutions</text>
    </g>

    <!-- Experience -->
    <g transform="translate(325, 0)">
      <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9zm-.5 2v3l2.5 1.5.5-.8-2-1.2V5.5h-1z" fill="#f472b6"/>
      <text x="18" y="11" fill="#cbd5e1" class="font-mono" font-size="11.5">2+ Years Exp</text>
    </g>
  </g>

  <!-- ================= RIGHT: CAMERA VIEWFINDER HUD ================= -->
  <g transform="translate(545, 34)">
    <!-- Viewfinder Outer Box -->
    <rect x="0" y="0" width="335" height="252" rx="12" fill="#0b0c14" stroke="#1f2438" stroke-width="1.2"/>
    
    <!-- Viewfinder Inner Grid -->
    <line x1="111" y1="20" x2="111" y2="232" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="3 3"/>
    <line x1="223" y1="20" x2="223" y2="232" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="3 3"/>
    <line x1="20" y1="84" x2="315" y2="84" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="3 3"/>
    <line x1="20" y1="168" x2="315" y2="168" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="3 3"/>

    <!-- Viewfinder Corner Brackets -->
    <!-- Top Left -->
    <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <!-- Top Right -->
    <path d="M 303 16 L 319 16 L 319 32" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <!-- Bottom Left -->
    <path d="M 16 220 L 16 236 L 32 236" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <!-- Bottom Right -->
    <path d="M 303 236 L 319 236 L 319 220" fill="none" stroke="#22d3ee" stroke-width="2"/>

    <!-- Center Reticle Crosshair -->
    <circle cx="167" cy="126" r="32" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="167" y1="110" x2="167" y2="142" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="151" y1="126" x2="183" y2="126" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Dynamic Tech Illustration Silhouette -->
    <g transform="translate(167, 126)">
      <!-- Pulsing Orbit Ring -->
      <ellipse rx="76" ry="34" fill="none" stroke="url(#aurora-stroke)" stroke-width="1.2" opacity="0.4" transform="rotate(-20)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="76" ry="34" fill="none" stroke="url(#aurora-stroke)" stroke-width="1.2" opacity="0.3" transform="rotate(40)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Central Core Node -->
      <circle cx="0" cy="0" r="14" fill="#13172e" stroke="#22d3ee" stroke-width="1.5"/>
      <polygon points="0,-7 6,4 -6,4" fill="#a78bfa"/>
    </g>

    <!-- Top Status Bar: REC & File Info -->
    <circle cx="28" cy="30" r="4.5" fill="#ef4444" class="rec-pulse"/>
    <text x="39" y="34" fill="#ef4444" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">REC</text>
    <text x="80" y="34" fill="#64748b" class="font-mono" font-size="10">4K // 60FPS</text>
    <text x="242" y="34" fill="#94a3b8" class="font-mono" font-size="10">DEV_HERO.RAW</text>

    <!-- Bottom Status Bar & Scrubber -->
    <text x="20" y="218" fill="#38bdf8" class="font-mono" font-size="10">ISO 400</text>
    <text x="76" y="218" fill="#94a3b8" class="font-mono" font-size="10">F/1.8</text>
    <text x="242" y="218" fill="#a78bfa" class="font-mono" font-size="10">00:04:12</text>
    
    <!-- Scrubber Bar Track -->
    <rect x="16" y="228" width="303" height="3" rx="1.5" fill="#1e243b"/>
    <!-- Animated Playhead -->
    <rect x="16" y="228" width="0" height="3" rx="1.5" fill="url(#text-aurora)" class="scrub-bar"/>
  </g>
</svg>

