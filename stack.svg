<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Background & Aurora Gradients -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="50%" stop-color="#121325"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </linearGradient>

    <linearGradient id="orbit-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbit-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbit-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="aurora-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d0e16" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stack-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="stack-card-clip">
      <rect x="0" y="0" width="920" height="380" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Orbit Rotations */
    @keyframes orbitRev1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitRev2 {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes orbitRev3 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .orbit-1 { animation: orbitRev1 24s linear infinite; }
    .orbit-2 { animation: orbitRev2 32s linear infinite; }
    .orbit-3 { animation: orbitRev3 40s linear infinite; }

    /* Chip Glow Cycling */
    @keyframes chipGlow {
      0%, 100% { border-color: #1e2438; }
      50% { stroke: #22d3ee; }
    }
    .chip-rect { transition: all 0.3s ease; }

    /* Pulsing core */
    @keyframes corePulse {
      0%, 100% { r: 18; opacity: 0.9; }
      50% { r: 23; opacity: 1; }
    }
    .atom-core { animation: corePulse 3s ease-in-out infinite; }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="918" height="378" rx="14" fill="url(#stack-bg)" stroke="url(#aurora-border)" stroke-width="1.2"/>
  <rect x="0" y="0" width="920" height="380" rx="14" fill="url(#stack-dots)" clip-path="url(#stack-card-clip)"/>

  <!-- Card Header -->
  <g transform="translate(36, 32)">
    <text fill="#22d3ee" class="font-mono" font-size="11" font-weight="600" letter-spacing="1">ARSENAL &amp; ECOSYSTEM</text>
    <text y="24" fill="#f8fafc" class="font-sans" font-size="20" font-weight="800">⚛️ Tech Orbit &amp; Engineering Stack</text>
  </g>

  <!-- ================= LEFT: ORBITING ATOM SYSTEM ================= -->
  <g transform="translate(195, 215)">
    <!-- Core Ambient Glow -->
    <circle cx="0" cy="0" r="100" fill="url(#core-glow)"/>

    <!-- Orbit 1: Ellipse 1 (Tilted -25deg) -->
    <g transform="rotate(-25)">
      <ellipse rx="135" ry="50" fill="none" stroke="url(#orbit-grad-1)" stroke-width="1.2" stroke-dasharray="6 3"/>
      <!-- Planetary Node 1 (React Core) -->
      <g class="orbit-1">
        <g transform="translate(135, 0)">
          <circle cx="0" cy="0" r="14" fill="#0d1124" stroke="#22d3ee" stroke-width="1.5"/>
          <text text-anchor="middle" dy="4" fill="#67e8f9" class="font-sans" font-size="10" font-weight="700">⚛️</text>
          
          <!-- Moon 1 orbiting React (Next.js) -->
          <g class="orbit-2">
            <g transform="translate(24, 0)">
              <circle cx="0" cy="0" r="6" fill="#1e2238" stroke="#ffffff" stroke-width="0.8"/>
              <text text-anchor="middle" dy="2.5" fill="#ffffff" class="font-mono" font-size="6">N</text>
            </g>
          </g>
          <!-- Moon 2 orbiting React (TypeScript) -->
          <g class="orbit-2">
            <g transform="translate(-24, 0)">
              <circle cx="0" cy="0" r="6" fill="#1e2238" stroke="#3178c6" stroke-width="0.8"/>
              <text text-anchor="middle" dy="2.5" fill="#38bdf8" class="font-mono" font-size="6">TS</text>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- Orbit 2: Ellipse 2 (Tilted 35deg) -->
    <g transform="rotate(35)">
      <ellipse rx="145" ry="55" fill="none" stroke="url(#orbit-grad-2)" stroke-width="1.2" stroke-dasharray="8 4"/>
      <!-- Planetary Node 2 (Node.js & Backend) -->
      <g class="orbit-2">
        <g transform="translate(-145, 0)">
          <circle cx="0" cy="0" r="13" fill="#0d1124" stroke="#a78bfa" stroke-width="1.5"/>
          <text text-anchor="middle" dy="3.5" fill="#a78bfa" class="font-mono" font-size="8" font-weight="700">NODE</text>
        </g>
      </g>
    </g>

    <!-- Orbit 3: Ellipse 3 (Tilted 90deg) -->
    <g transform="rotate(90)">
      <ellipse rx="140" ry="52" fill="none" stroke="url(#orbit-grad-3)" stroke-width="1.2" stroke-dasharray="4 4"/>
      <!-- Planetary Node 3 (AWS Cloud & Docker) -->
      <g class="orbit-3">
        <g transform="translate(0, 140)">
          <circle cx="0" cy="0" r="13" fill="#0d1124" stroke="#f472b6" stroke-width="1.5"/>
          <text text-anchor="middle" dy="3.5" fill="#f472b6" class="font-mono" font-size="8" font-weight="700">AWS</text>
        </g>
      </g>
    </g>

    <!-- Glowing Atom Core -->
    <circle cx="0" cy="0" r="18" fill="#161b36" stroke="#22d3ee" stroke-width="2" class="atom-core"/>
    <text text-anchor="middle" dy="4" fill="#ffffff" class="font-mono" font-size="10" font-weight="800">&lt;/&gt;</text>
  </g>

  <!-- ================= RIGHT: GROUPED CHIP GRID ================= -->
  <g transform="translate(425, 42)">
    
    <!-- Group 1: Frontend & UI Systems -->
    <g transform="translate(0, 18)">
      <text fill="#22d3ee" class="font-mono" font-size="11" font-weight="700" letter-spacing="0.5">FRONTEND &amp; UI SYSTEMS</text>
      <!-- Chips -->
      <g transform="translate(0, 12)">
        <!-- React 19 -->
        <rect x="0" y="0" width="88" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="12" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">⚛️ React</text>

        <!-- Next.js -->
        <rect x="96" y="0" width="94" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="108" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">▲ Next.js</text>

        <!-- TypeScript -->
        <rect x="198" y="0" width="102" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="210" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">🔷 TypeScript</text>

        <!-- Tailwind CSS -->
        <rect x="308" y="0" width="108" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="320" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">🌊 Tailwind</text>

        <!-- Row 2 -->
        <rect x="0" y="34" width="104" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="12" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">✨ shadcn/ui</text>

        <rect x="112" y="34" width="112" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="124" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">⚡ TanStack Q</text>

        <rect x="232" y="34" width="102" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="244" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">🔄 Redux/Zst</text>

        <rect x="342" y="34" width="106" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="354" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">📝 Hook Form</text>
      </g>
    </g>

    <!-- Group 2: Backend & Databases -->
    <g transform="translate(0, 118)">
      <text fill="#a78bfa" class="font-mono" font-size="11" font-weight="700" letter-spacing="0.5">BACKEND &amp; DATABASES</text>
      <g transform="translate(0, 12)">
        <rect x="0" y="0" width="96" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="12" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">🟢 Node.js</text>

        <rect x="104" y="0" width="106" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="116" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">⚡ Express.js</text>

        <rect x="218" y="0" width="94" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="230" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">🐍 FastAPI</text>

        <rect x="320" y="0" width="112" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="332" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">🐘 PostgreSQL</text>

        <!-- Row 2 -->
        <rect x="0" y="34" width="106" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="12" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">◭ Prisma ORM</text>

        <rect x="114" y="34" width="98" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="126" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">🍃 MongoDB</text>

        <rect x="220" y="34" width="118" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="232" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">🔐 OAuth / RBAC</text>
      </g>
    </g>

    <!-- Group 3: Cloud, DevOps & Testing -->
    <g transform="translate(0, 218)">
      <text fill="#f472b6" class="font-mono" font-size="11" font-weight="700" letter-spacing="0.5">CLOUD, DEVOPS &amp; TESTING</text>
      <g transform="translate(0, 12)">
        <rect x="0" y="0" width="98" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="12" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">☁️ AWS EC2/S3</text>

        <rect x="106" y="0" width="104" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="118" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">🐳 Docker</text>

        <rect x="218" y="0" width="112" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="230" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">📦 AWS ECS/ECR</text>

        <rect x="338" y="0" width="98" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="350" y="18" fill="#e2e8f0" class="font-sans" font-size="11.5">🌐 Nginx</text>

        <!-- Row 2 -->
        <rect x="0" y="34" width="106" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="12" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">🏗️ Terraform</text>

        <rect x="114" y="34" width="112" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="126" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">🚀 GitHub Actions</text>

        <rect x="234" y="34" width="108" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="246" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">🎭 Playwright</text>

        <rect x="350" y="34" width="98" height="28" rx="6" fill="#121629" stroke="#1f253d" stroke-width="1"/>
        <text x="362" y="52" fill="#e2e8f0" class="font-sans" font-size="11.5">🐧 Linux / Bash</text>
      </g>
    </g>

  </g>
</svg>

