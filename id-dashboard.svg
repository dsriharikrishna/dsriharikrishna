<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="id-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="50%" stop-color="#121426"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </linearGradient>

    <linearGradient id="aurora-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Holographic Foil Sweep Gradient -->
    <linearGradient id="holo-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1, -1" to="1, 1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Gold SIM Chip Gradient -->
    <linearGradient id="gold-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <pattern id="card-dot-pattern" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="dash-clip">
      <rect x="0" y="0" width="920" height="360" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Damped Pendulum Swing for ID Badge */
    @keyframes pendulumSwing {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(3.2deg); }
      40% { transform: rotate(-2.4deg); }
      60% { transform: rotate(1.4deg); }
      80% { transform: rotate(-0.6deg); }
      100% { transform: rotate(0deg); }
    }
    .badge-swing {
      transform-origin: 150px 10px;
      animation: pendulumSwing 7s ease-in-out infinite;
    }

    /* Travelling Light Border */
    @keyframes borderLight {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 360; }
    }
    .orbit-border {
      stroke-dasharray: 60 120;
      animation: borderLight 5s linear infinite;
    }

    /* Bar Grow Animations */
    @keyframes barGrow1 { from { width: 0; } to { width: 220px; } }
    @keyframes barGrow2 { from { width: 0; } to { width: 175px; } }
    @keyframes barGrow3 { from { width: 0; } to { width: 140px; } }
    @keyframes barGrow4 { from { width: 0; } to { width: 110px; } }
    .bar-g1 { animation: barGrow1 1.2s ease-out forwards; }
    .bar-g2 { animation: barGrow2 1.4s ease-out forwards; }
    .bar-g3 { animation: barGrow3 1.6s ease-out forwards; }
    .bar-g4 { animation: barGrow4 1.8s ease-out forwards; }
  </style>

  <!-- Base Dashboard Canvas -->
  <rect x="1" y="1" width="918" height="358" rx="14" fill="url(#id-bg-grad)" stroke="url(#aurora-border)" stroke-width="1.2"/>
  <rect x="0" y="0" width="920" height="360" rx="14" fill="url(#card-dot-pattern)" clip-path="url(#dash-clip)"/>

  <!-- ================= LEFT: HOLOGRAPHIC ID BADGE ================= -->
  <g class="badge-swing">
    <!-- Lanyard Strap with Printed Text -->
    <rect x="138" y="0" width="24" height="42" fill="#181c2e" stroke="#252c45" stroke-width="0.8"/>
    <text x="146" y="24" fill="#a78bfa" class="font-mono" font-size="7" font-weight="700" letter-spacing="1" transform="rotate(90 146 24)">PROD•ENG</text>
    
    <!-- Metal Clip Clasp -->
    <rect x="135" y="38" width="30" height="12" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="150" cy="44" r="3" fill="#0f111a"/>

    <!-- ID Badge Outer Frame -->
    <g transform="translate(42, 54)">
      <!-- Main Badge Card -->
      <rect x="0" y="0" width="216" height="280" rx="12" fill="#0f1222" stroke="#262f4e" stroke-width="1.2"/>
      <!-- Holographic Foil Overlay Sweep -->
      <rect x="0" y="0" width="216" height="280" rx="12" fill="url(#holo-foil)"/>

      <!-- Header Chip & Pass Text -->
      <rect x="16" y="14" width="70" height="18" rx="4" fill="#1b2038"/>
      <text x="24" y="26" fill="#22d3ee" class="font-mono" font-size="8.5" font-weight="700" letter-spacing="0.5">STAFF // 09</text>

      <!-- Gold Smart Chip -->
      <rect x="160" y="12" width="40" height="28" rx="5" fill="url(#gold-chip)" stroke="#78350f" stroke-width="0.8"/>
      <line x1="160" y1="26" x2="200" y2="26" stroke="#78350f" stroke-width="0.8"/>
      <line x1="178" y1="12" x2="178" y2="40" stroke="#78350f" stroke-width="0.8"/>
      <circle cx="178" cy="26" r="3" fill="#78350f"/>

      <!-- Portrait Frame with Travelling Light Border -->
      <g transform="translate(48, 52)">
        <rect x="0" y="0" width="120" height="120" rx="10" fill="#15192c" stroke="#1f253f" stroke-width="1"/>
        <rect x="0" y="0" width="120" height="120" rx="10" fill="none" stroke="url(#aurora-border)" stroke-width="1.8" class="orbit-border"/>
        
        <!-- Dev Avatar Graphic -->
        <circle cx="60" cy="48" r="22" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
        <text text-anchor="middle" x="60" y="55" class="font-sans" font-size="24">👨‍💻</text>
        <path d="M 28 108 C 28 84 92 84 92 108" fill="#a78bfa" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1"/>
      </g>

      <!-- Badge Holder Info -->
      <text text-anchor="middle" x="108" y="194" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">D. Sriharikrishna</text>
      <text text-anchor="middle" x="108" y="210" fill="#22d3ee" class="font-mono" font-size="10" font-weight="600">PRODUCT ENGINEER</text>
      <text text-anchor="middle" x="108" y="226" fill="#94a3b8" class="font-sans" font-size="9.5">Signitives IT Solutions</text>

      <!-- Security Barcode -->
      <g transform="translate(24, 240)">
        <rect x="0" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="4" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="10" y="0" width="1" height="18" fill="#e2e8f0"/>
        <rect x="13" y="0" width="3" height="18" fill="#e2e8f0"/>
        <rect x="18" y="0" width="5" height="18" fill="#e2e8f0"/>
        <rect x="25" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="29" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="35" y="0" width="1" height="18" fill="#e2e8f0"/>
        <rect x="38" y="0" width="3" height="18" fill="#e2e8f0"/>
        <rect x="43" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="47" y="0" width="5" height="18" fill="#e2e8f0"/>
        <rect x="54" y="0" width="3" height="18" fill="#e2e8f0"/>
        <rect x="59" y="0" width="1" height="18" fill="#e2e8f0"/>
        <rect x="62" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="68" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="72" y="0" width="5" height="18" fill="#e2e8f0"/>
        <rect x="79" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="83" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="89" y="0" width="1" height="18" fill="#e2e8f0"/>
        <rect x="92" y="0" width="3" height="18" fill="#e2e8f0"/>
        <rect x="97" y="0" width="5" height="18" fill="#e2e8f0"/>
        <rect x="104" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="108" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="114" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="118" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="124" y="0" width="3" height="18" fill="#e2e8f0"/>
        <rect x="129" y="0" width="1" height="18" fill="#e2e8f0"/>
        <rect x="132" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="138" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="142" y="0" width="5" height="18" fill="#e2e8f0"/>
        <rect x="149" y="0" width="2" height="18" fill="#e2e8f0"/>
        <rect x="153" y="0" width="4" height="18" fill="#e2e8f0"/>
        <rect x="159" y="0" width="3" height="18" fill="#e2e8f0"/>
        <rect x="164" y="0" width="4" height="18" fill="#e2e8f0"/>
      </g>
      <text text-anchor="middle" x="108" y="271" fill="#64748b" class="font-mono" font-size="8">AUTH-ID: DSRI-2026-CLOUD-FS</text>
    </g>
  </g>

  <!-- ================= RIGHT: MISSION DASHBOARD ================= -->
  <g transform="translate(295, 24)">
    
    <!-- Row 1: KPI Tiles -->
    <g transform="translate(0, 0)">
      <!-- Tile 1 -->
      <rect x="0" y="0" width="142" height="74" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <text x="14" y="24" fill="#94a3b8" class="font-mono" font-size="10">EXPERIENCE</text>
      <text x="14" y="54" fill="#22d3ee" class="font-sans" font-size="24" font-weight="800">2+ <tspan font-size="14" font-weight="600" fill="#94a3b8">Yrs</tspan></text>

      <!-- Tile 2 -->
      <rect x="154" y="0" width="142" height="74" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <text x="168" y="24" fill="#94a3b8" class="font-mono" font-size="10">PROD REPOS</text>
      <text x="168" y="54" fill="#a78bfa" class="font-sans" font-size="24" font-weight="800">18+ <tspan font-size="14" font-weight="600" fill="#94a3b8">Apps</tspan></text>

      <!-- Tile 3 -->
      <rect x="308" y="0" width="142" height="74" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <text x="322" y="24" fill="#94a3b8" class="font-mono" font-size="10">TARGET PATH</text>
      <text x="322" y="54" fill="#f472b6" class="font-sans" font-size="16" font-weight="800">Cloud + FS</text>

      <!-- Tile 4 -->
      <rect x="462" y="0" width="138" height="74" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <text x="476" y="24" fill="#94a3b8" class="font-mono" font-size="10">COMMIT STREAK</text>
      <text x="476" y="54" fill="#38bdf8" class="font-sans" font-size="24" font-weight="800">Active</text>
    </g>

    <!-- Row 2: Production Impact Bar Chart -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="375" height="216" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <text x="18" y="28" fill="#e2e8f0" class="font-sans" font-size="13.5" font-weight="700">📊 Enterprise Modules &amp; Scale</text>
      <text x="18" y="44" fill="#64748b" class="font-mono" font-size="9.5">PRODUCTION ARCHITECTURE VELOCITY</text>

      <!-- Bar 1: ORKA AI Platform -->
      <g transform="translate(18, 64)">
        <text x="0" y="12" fill="#cbd5e1" class="font-sans" font-size="11.5">ORKA.AI Operations</text>
        <rect x="0" y="18" width="335" height="10" rx="5" fill="#1c223a"/>
        <rect x="0" y="18" width="300" height="10" rx="5" fill="#22d3ee" class="bar-g1"/>
        <text x="310" y="27" fill="#22d3ee" class="font-mono" font-size="10" font-weight="700">95%</text>
      </g>

      <!-- Bar 2: Workflow Builder & RBAC -->
      <g transform="translate(18, 102)">
        <text x="0" y="12" fill="#cbd5e1" class="font-sans" font-size="11.5">Workflow Engine &amp; RBAC</text>
        <rect x="0" y="18" width="335" height="10" rx="5" fill="#1c223a"/>
        <rect x="0" y="18" width="260" height="10" rx="5" fill="#a78bfa" class="bar-g2"/>
        <text x="270" y="27" fill="#a78bfa" class="font-mono" font-size="10" font-weight="700">85%</text>
      </g>

      <!-- Bar 3: Cloud & Docker Deployment -->
      <g transform="translate(18, 140)">
        <text x="0" y="12" fill="#cbd5e1" class="font-sans" font-size="11.5">AWS ECS / S3 / Docker Setup</text>
        <rect x="0" y="18" width="335" height="10" rx="5" fill="#1c223a"/>
        <rect x="0" y="18" width="210" height="10" rx="5" fill="#f472b6" class="bar-g3"/>
        <text x="220" y="27" fill="#f472b6" class="font-mono" font-size="10" font-weight="700">70%</text>
      </g>

      <!-- Bar 4: End-to-End Testing (Playwright) -->
      <g transform="translate(18, 178)">
        <text x="0" y="12" fill="#cbd5e1" class="font-sans" font-size="11.5">Playwright E2E &amp; QA Systems</text>
        <rect x="0" y="18" width="335" height="10" rx="5" fill="#1c223a"/>
        <rect x="0" y="18" width="180" height="10" rx="5" fill="#38bdf8" class="bar-g4"/>
        <text x="190" y="27" fill="#38bdf8" class="font-mono" font-size="10" font-weight="700">60%</text>
      </g>
    </g>

    <!-- Row 2 (Right): "NOW" Live Focus Panel -->
    <g transform="translate(390, 90)">
      <rect x="0" y="0" width="210" height="216" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <circle cx="20" cy="24" r="4" fill="#22c55e"/>
      <text x="32" y="28" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">Now Active</text>
      <text x="18" y="44" fill="#64748b" class="font-mono" font-size="9.5">LIVE PULSE // 2026</text>

      <g transform="translate(16, 62)">
        <text fill="#22d3ee" class="font-mono" font-size="11" font-weight="700">⚡ BUILDING</text>
        <text y="16" fill="#cbd5e1" class="font-sans" font-size="11.5">Distributed backend queues</text>
        <text y="30" fill="#94a3b8" class="font-sans" font-size="10.5">Kafka • BullMQ • Redis</text>
      </g>

      <g transform="translate(16, 112)">
        <text fill="#a78bfa" class="font-mono" font-size="11" font-weight="700">☁️ INFRASTRUCTURE</text>
        <text y="16" fill="#cbd5e1" class="font-sans" font-size="11.5">Terraform &amp; AWS EKS</text>
        <text y="30" fill="#94a3b8" class="font-sans" font-size="10.5">Automated provisioning</text>
      </g>

      <g transform="translate(16, 162)">
        <text fill="#f472b6" class="font-mono" font-size="11" font-weight="700">🎯 TARGETING</text>
        <text y="16" fill="#cbd5e1" class="font-sans" font-size="11.5">Full Stack &amp; Cloud roles</text>
        <text y="30" fill="#94a3b8" class="font-sans" font-size="10.5">SDE-2 / Product Engineering</text>
      </g>
    </g>

  </g>
</svg>

