<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="connect-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="50%" stop-color="#121326"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </linearGradient>

    <linearGradient id="aurora-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <pattern id="connect-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="conn-clip">
      <rect x="0" y="0" width="920" height="220" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Nudging arrow animation */
    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(5px); }
    }
    .arrow-nudge { animation: nudge 1.5s ease-in-out infinite; }

    /* Neon Sign Float */
    @keyframes neonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .neon-card { animation: neonFloat 3s ease-in-out infinite; }

    /* Sparkle pulse */
    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .sparkle-dot { animation: sparkle 2s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect x="1" y="1" width="918" height="218" rx="14" fill="url(#connect-bg)" stroke="url(#aurora-stroke)" stroke-width="1.2"/>
  <rect x="0" y="0" width="920" height="220" rx="14" fill="url(#connect-dots)" clip-path="url(#conn-clip)"/>

  <!-- ================= LEFT: CHARACTER & NEON SIGN ================= -->
  <g transform="translate(42, 35)">
    <!-- Neon Signboard -->
    <g class="neon-card">
      <rect x="0" y="0" width="310" height="150" rx="12" fill="#111425" stroke="url(#neon-glow)" stroke-width="1.5"/>
      
      <!-- Sparkle Accents -->
      <polygon points="20,20 22,14 28,16 23,21 26,27 20,23 15,26 17,21 12,17 18,15" fill="#fde047" class="sparkle-dot"/>
      <polygon points="285,120 286,115 291,116 287,121 289,126 284,123 280,125 282,121 278,118 283,116" fill="#f472b6" class="sparkle-dot" style="animation-delay: 1s;"/>

      <!-- Glowing Neon Username -->
      <text x="24" y="44" fill="#64748b" class="font-mono" font-size="11" letter-spacing="1">LET'S CONNECT &amp; BUILD</text>
      <text x="24" y="80" fill="url(#neon-glow)" class="font-mono" font-size="24" font-weight="800">@dsriharikrishna</text>
      <text x="24" y="105" fill="#e2e8f0" class="font-sans" font-size="12.5" font-weight="600">Always excited to chat about:</text>
      <text x="24" y="125" fill="#94a3b8" class="font-sans" font-size="11.5">🚀 High-Scale Frontends • Cloud Systems • Open Source</text>
    </g>

    <!-- Character Pointing Silhouette -->
    <g transform="translate(325, 65)">
      <circle cx="16" cy="12" r="14" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.2"/>
      <text text-anchor="middle" x="16" y="17" class="font-sans" font-size="16">👉</text>
    </g>
  </g>

  <!-- ================= RIGHT: INTERACTIVE BRAND LINK CARDS ================= -->
  <g transform="translate(425, 28)">
    
    <!-- Link Card 1: GitHub -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="224" height="72" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <!-- Brand Icon Container -->
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#1b1f36"/>
      <text x="24" y="42" class="font-sans" font-size="22">🐙</text>
      <!-- Labels -->
      <text x="70" y="32" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">GitHub</text>
      <text x="70" y="48" fill="#94a3b8" class="font-mono" font-size="10.5">/dsriharikrishna</text>
      <!-- Nudging Arrow -->
      <g class="arrow-nudge" transform="translate(196, 32)">
        <path d="M0 0 L5 4 L0 8" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Link Card 2: LinkedIn -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="224" height="72" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#1b1f36"/>
      <text x="24" y="42" class="font-sans" font-size="22">💼</text>
      <text x="70" y="32" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">LinkedIn</text>
      <text x="70" y="48" fill="#94a3b8" class="font-mono" font-size="10.5">/dasari-sriharikrishna</text>
      <g class="arrow-nudge" transform="translate(196, 32)">
        <path d="M0 0 L5 4 L0 8" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Link Card 3: Portfolio -->
    <g transform="translate(0, 86)">
      <rect x="0" y="0" width="224" height="72" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#1b1f36"/>
      <text x="24" y="42" class="font-sans" font-size="22">🌐</text>
      <text x="70" y="32" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">Portfolio</text>
      <text x="70" y="48" fill="#94a3b8" class="font-mono" font-size="10.5">dsrikportfolio.app</text>
      <g class="arrow-nudge" transform="translate(196, 32)">
        <path d="M0 0 L5 4 L0 8" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Link Card 4: Email -->
    <g transform="translate(240, 86)">
      <rect x="0" y="0" width="224" height="72" rx="10" fill="#121528" stroke="#1d233c" stroke-width="1"/>
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#1b1f36"/>
      <text x="24" y="42" class="font-sans" font-size="22">✉️</text>
      <text x="70" y="32" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">Direct Email</text>
      <text x="70" y="48" fill="#94a3b8" class="font-mono" font-size="10.5">dsriharik8432@...</text>
      <g class="arrow-nudge" transform="translate(196, 32)">
        <path d="M0 0 L5 4 L0 8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

  </g>
</svg>

